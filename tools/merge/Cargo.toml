[package]
name = "obsidian-merge"
version = "0.1.0"
edition = "2024"

# Builds standalone, outside the engine workspace at the repo root.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
claxon = "0.4.3"
ebur128 = "0.1.10"
hound = "3.5.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.test]
opt-level = 3
