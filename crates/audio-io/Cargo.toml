[package]
name = "obsidian-audio-io"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Audio devices (cpal), Windows system-audio capture that skips our own output, music file decoding, and clock-bridging resamplers."

[dependencies]
anyhow.workspace = true
cpal = "0.18"
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "aiff", "ogg", "vorbis"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.25"
