name: desktop

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "crates/**", "Cargo.toml", "Cargo.lock", "services/rendezvous/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "crates/**", "Cargo.toml", "Cargo.lock", "services/rendezvous/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/desktop/ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Tauri's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/ui/src-tauri
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - name: Rust tests (devices, booth link, two booths through a real room server)
        working-directory: apps/desktop/ui/src-tauri
        run: cargo clippy --all-targets -- -D warnings && cargo test

  # The installer Brian and a friend run. Download it from the run's Artifacts.
  windows-installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/ui/src-tauri
      - run: npm ci
      - name: Build the installer
        # The room server baked into this build; set it as a repository
        # variable once the server is deployed. Without it the app still opens
        # and offers the demo.
        env:
          OBSIDIAN_DEFAULT_SERVER: ${{ vars.OBSIDIAN_SERVER }}
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Obsidian-windows-installer
          path: apps/desktop/ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
