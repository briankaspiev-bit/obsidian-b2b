name: engine

on:
  push:
    branches: [main]
    paths: ["crates/**", "tools/**", "Cargo.toml", "Cargo.lock", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["crates/**", "tools/**", "Cargo.toml", "Cargo.lock", ".github/workflows/engine.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (Opus is built from source by opusic-sys)
        run: cargo test --workspace --release
      - name: Build all binaries (the bench runs obsidian-netem and obsidian-peer)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --workspace
      - name: Bench smoke (loopback, 30 s)
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --release -p obsidian-bench -- run --out bench-out --only clean --duration 30
