[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/codec",
    "crates/clock",
    "crates/jitter",
    "crates/align",
    "crates/engine",
    "crates/engine-cli",
    "tools/netem-proxy",
    "tools/bench",
]
# tools/merge is owned by another workstream and builds on its own.
exclude = ["tools/merge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
obsidian-protocol = { path = "crates/protocol" }
obsidian-codec = { path = "crates/codec" }
obsidian-clock = { path = "crates/clock" }
obsidian-jitter = { path = "crates/jitter" }
obsidian-align = { path = "crates/align" }
obsidian-engine = { path = "crates/engine" }
opus = "0.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = 1
